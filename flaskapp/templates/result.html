{% extends "bootstrap/base.html" %}
{% block title %}Результат{% endblock %}
{% block content %}
<div class="container">
    <h1>Результат обработки</h1>
    <p><strong>Уровень шума:</strong> {{ noise_level }}</p>
    <div class="row">
        <div class="col-md-6">
            <h3>Исходное изображение</h3>
            <img src="data:image/png;base64,{{ orig_image }}" class="img-fluid">
            <h3>Гистограмма исходного</h3>
            <img src="data:image/png;base64,{{ orig_hist }}" class="img-fluid">
        </div>
        <div class="col-md-6">
            <h3>Зашумленное изображение</h3>
            <img src="data:image/png;base64,{{ noisy_image }}" class="img-fluid">
            <h3>Гистограмма зашумленного</h3>
            <img src="data:image/png;base64,{{ noisy_hist }}" class="img-fluid">
        </div>
    </div>
    <a href="/" class="btn btn-primary">Назад</a>
</div>
{% endblock %}
